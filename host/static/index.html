<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Media Control — Teste Fase 1</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --separator: #d2d2d7;
      --danger: #d93025;
      --ok: #188038;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --surface: #1c1c1e;
        --text: #f5f5f7;
        --text-secondary: #a1a1a6;
        --accent: #0a84ff;
        --separator: #38383a;
        --danger: #ff453a;
        --ok: #32d74b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 780px; margin: 0 auto; display: grid; gap: 16px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 600; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--separator);
      background: var(--surface);
      color: var(--text-secondary);
    }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.err { color: var(--danger); border-color: var(--danger); }
    .card {
      background: var(--surface);
      border: 1px solid var(--separator);
      border-radius: 20px;
      padding: 18px;
    }
    .error-banner {
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--danger);
      color: var(--danger);
      background: var(--surface);
      font-size: 0.9rem;
    }
    .session-item {
      border: 1px solid var(--separator);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      gap: 10px;
      margin-bottom: 10px;
    }
    .session-item:last-child { margin-bottom: 0; }
    .session-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .meta-title { font-weight: 600; font-size: 1rem; }
    .meta-sub { color: var(--text-secondary); font-size: 0.88rem; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      cursor: pointer;
      border: 1px solid var(--separator);
      background: var(--bg);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      min-height: 38px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .slider-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .audio-row {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) 2fr auto;
      gap: 12px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--separator);
    }
    .audio-row:last-child { border-bottom: none; }
    @media (max-width: 560px) {
      .audio-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PC Media Control — Cliente de Teste (Fase 1)</h1>
      <div class="badges">
        <span id="conn-badge" class="badge">Conectando...</span>
        <span id="ext-badge" class="badge">Extensão Chrome: desconectada</span>
      </div>
    </header>

    <div id="error-banner" class="error-banner"></div>

    <section class="card">
      <h2>Sessões de Mídia Unificadas</h2>
      <div id="sessions-list" class="meta-sub">Nenhuma mídia detectada no momento.</div>
    </section>

    <section class="card">
      <h2>Fallback Global (Teclas de Mídia — ex.: VLC 3.x)</h2>
      <div class="controls">
        <button data-cmd-session="windows:fallback" data-cmd-action="previous">Anterior (tecla)</button>
        <button class="primary" data-cmd-session="windows:fallback" data-cmd-action="toggle">Play / Pause (tecla)</button>
        <button data-cmd-session="windows:fallback" data-cmd-action="next">Próximo (tecla)</button>
      </div>
    </section>

    <section class="card">
      <h2>Volume Geral e por Aplicativo</h2>
      <div id="master-volume"></div>
      <hr style="border: none; border-top: 1px solid var(--separator); margin: 14px 0;" />
      <div id="audio-sessions" class="meta-sub">Carregando sessões de áudio...</div>
    </section>
  </div>

  <script>
    let ws = null;
    let reconnectTimer = null;
    let isDragging = false;

    const connBadge = document.getElementById("conn-badge");
    const extBadge = document.getElementById("ext-badge");
    const errorBanner = document.getElementById("error-banner");
    const sessionsList = document.getElementById("sessions-list");
    const masterBox = document.getElementById("master-volume");
    const audioBox = document.getElementById("audio-sessions");

    function fmtTime(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML.replace(/"/g, "&quot;");
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
      setTimeout(() => { errorBanner.style.display = "none"; }, 4000);
    }

    function sendPayload(obj) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        showError("Sem conexão WebSocket com o host.");
        return;
      }
      ws.send(JSON.stringify({ v: 1, ...obj }));
    }

    function sendCommand(sessionId, action, value = undefined) {
      const payload = { type: "command", sessionId, action };
      if (value !== undefined) payload.value = value;
      sendPayload(payload);
    }

    function sendVolume(target, value, muted = undefined) {
      const payload = { type: "volume", target };
      if (value !== undefined) payload.value = value;
      if (muted !== undefined) payload.muted = muted;
      sendPayload(payload);
    }

    function selectSession(sessionId) {
      sendPayload({ type: "select", sessionId });
    }

    document.addEventListener("click", (event) => {
      const btn = event.target.closest("button");
      if (!btn) return;
      if (btn.dataset.cmdSession && btn.dataset.cmdAction) {
        sendCommand(btn.dataset.cmdSession, btn.dataset.cmdAction);
      } else if (btn.dataset.selectSession) {
        selectSession(btn.dataset.selectSession);
      } else if (btn.dataset.muteTarget) {
        sendVolume(btn.dataset.muteTarget, undefined, btn.dataset.muteNext === "true");
      }
    });

    document.addEventListener("mousedown", (e) => {
      if (e.target.matches('input[type="range"]')) isDragging = true;
    });
    document.addEventListener("mouseup", () => { isDragging = false; });
    document.addEventListener("touchstart", (e) => {
      if (e.target.matches('input[type="range"]')) isDragging = true;
    }, { passive: true });
    document.addEventListener("touchend", () => { isDragging = false; });

    document.addEventListener("input", (event) => {
      const el = event.target;
      if (!el.matches('input[type="range"]')) return;
      if (el.dataset.volTarget) {
        sendVolume(el.dataset.volTarget, Number(el.value));
      }
    });

    document.addEventListener("change", (event) => {
      const el = event.target;
      if (!el.matches('input[type="range"]')) return;
      isDragging = false;
      if (el.dataset.seekSession) {
        sendCommand(el.dataset.seekSession, "seek", Number(el.value));
      } else if (el.dataset.volTarget) {
        sendVolume(el.dataset.volTarget, Number(el.value));
      }
    });

    function renderState(state) {
      extBadge.textContent = state.extensionConnected
        ? "Extensão Chrome: conectada"
        : "Extensão Chrome: desconectada";
      extBadge.className = `badge ${state.extensionConnected ? "ok" : ""}`;

      if (!state.sessions || state.sessions.length === 0) {
        sessionsList.innerHTML = `<div class="meta-sub">Nenhuma sessão de mídia ativa encontrada.</div>`;
      } else {
        sessionsList.innerHTML = state.sessions.map((s) => {
          const isActive = s.id === state.activeSessionId;
          const dur = Math.max(0, s.duration || 0);
          const pos = Math.min(dur || s.position || 0, Math.max(0, s.position || 0));
          const toggleAction = s.status === "PLAYING" ? "pause" : "play";
          const toggleLabel = s.status === "PLAYING" ? "Pausar" : "Tocar";
          const tabVolHtml = s.source === "chrome" && s.volume !== null
            ? `<div class="slider-row">
                 <input type="range" min="0" max="1" step="0.01" value="${s.volume}"
                   data-vol-target="${escapeHtml(s.id)}" />
                 <span class="meta-sub">Vol. aba: ${Math.round(s.volume * 100)}%</span>
               </div>`
            : "";
          return `
            <div class="session-item ${isActive ? "active" : ""}">
              <div class="row">
                <div>
                  <div class="meta-title">${escapeHtml(s.title || "(Sem título)")}</div>
                  <div class="meta-sub">
                    ${escapeHtml(s.artist || "Artista desconhecido")} · ${escapeHtml(s.app)}
                    · status: <strong>${escapeHtml(s.status)}</strong>
                  </div>
                  <div class="meta-sub" style="font-size:0.75rem;">
                    origem: <code>${escapeHtml(s.source)}</code> · id: <code>${escapeHtml(s.id)}</code>
                  </div>
                </div>
                <button data-select-session="${escapeHtml(s.id)}" ${isActive ? "disabled" : ""}>
                  ${isActive ? "Ativa" : "Selecionar"}
                </button>
              </div>
              <div class="slider-row">
                <input type="range" min="0" max="${dur || 100}" step="1" value="${pos}"
                  data-seek-session="${escapeHtml(s.id)}"
                  ${s.controls && s.controls.seek && dur > 0 ? "" : "disabled"} />
                <span class="meta-sub">${fmtTime(pos)} / ${fmtTime(dur)}</span>
              </div>
              ${tabVolHtml}
              <div class="controls">
                <button data-cmd-session="${escapeHtml(s.id)}" data-cmd-action="previous"
                  ${s.controls && s.controls.previous ? "" : "disabled"}>Anterior</button>
                <button class="primary" data-cmd-session="${escapeHtml(s.id)}" data-cmd-action="${toggleAction}"
                  ${s.controls && (s.controls.play || s.controls.pause || s.controls.toggle) ? "" : "disabled"}>
                  ${toggleLabel}
                </button>
                <button data-cmd-session="${escapeHtml(s.id)}" data-cmd-action="next"
                  ${s.controls && s.controls.next ? "" : "disabled"}>Próximo</button>
              </div>
            </div>
          `;
        }).join("");
      }

      const m = state.masterVolume;
      masterBox.innerHTML = `
        <div class="audio-row">
          <div>
            <div class="meta-title">Volume Geral</div>
            <div class="meta-sub">${escapeHtml(m.deviceName)} (${Math.round(m.level * 100)}%)</div>
          </div>
          <input type="range" min="0" max="1" step="0.01" value="${m.level}" data-vol-target="master" />
          <button data-mute-target="master" data-mute-next="${!m.muted}">
            ${m.muted ? "Ativar som" : "Silenciar"}
          </button>
        </div>
      `;

      if (!state.audioSessions || state.audioSessions.length === 0) {
        audioBox.innerHTML = `<div class="meta-sub">Nenhuma sessão de áudio por app encontrada.</div>`;
      } else {
        audioBox.innerHTML = state.audioSessions.map((a) => `
          <div class="audio-row">
            <div>
              <div class="meta-title">${escapeHtml(a.app)} ${a.active ? "●" : ""}</div>
              <div class="meta-sub">${escapeHtml(a.processName)} (${Math.round(a.volume * 100)}%)</div>
            </div>
            <input type="range" min="0" max="1" step="0.01" value="${a.volume}"
              data-vol-target="${escapeHtml(a.id)}" />
            <button data-mute-target="${escapeHtml(a.id)}" data-mute-next="${!a.muted}">
              ${a.muted ? "Ativar som" : "Silenciar"}
            </button>
          </div>
        `).join("");
      }
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws`);
      connBadge.textContent = "Conectando...";
      connBadge.className = "badge";

      ws.onopen = () => {
        connBadge.textContent = "Conectado (127.0.0.1)";
        connBadge.className = "badge ok";
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "state") {
          if (!isDragging) renderState(msg);
        } else if (msg.type === "error") {
          showError(msg.message || "Erro ao processar comando.");
        }
      };

      ws.onclose = () => {
        connBadge.textContent = "Desconectado — reconectando...";
        connBadge.className = "badge err";
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 1500);
      };
    }

    connect();
  </script>
</body>
</html>
