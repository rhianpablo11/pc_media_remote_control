<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>PC Media Control</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 310px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1c1c1e;
      color: #f5f5f7;
      font-size: 13px;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; justify-content: space-between; margin: 5px 0; color: #a1a1a6; }
    .val { color: #f5f5f7; font-weight: 600; }
    .ok { color: #32d74b; }
    .err { color: #ff453a; }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: 1px solid #38383a;
      border-radius: 8px;
      background: #2c2c2e;
      color: #f5f5f7;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>PC Media Control — Ponte Chrome</h1>
  <div class="row"><span>Host WS:</span><span id="status" class="val">Verificando...</span></div>
  <div class="row"><span>Abas detectadas:</span><span id="tabs-count" class="val">0</span></div>
  <div class="row"><span>Pings / Pongs:</span><span id="pings" class="val">0 / 0</span></div>
  <div class="row"><span>Último pong:</span><span id="last-pong" class="val">—</span></div>
  <div class="row"><span>MediaSession (isolated):</span><span id="probe-iso" class="val">—</span></div>
  <div class="row"><span>MediaSession (MAIN) / DOM:</span><span id="probe-main" class="val">—</span></div>
  <button id="reconnect-btn">Reconectar ao host</button>
  <script src="popup.js"></script>
</body>
</html>
